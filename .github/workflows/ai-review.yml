name: AI PR Review

# Dünner Stub — die Logik liegt zentral in pungggi/ai-review (reusable workflow).
# Vorteile: Script-Updates kommen automatisch mit, ein Secret gibt es dort.
# Für diesen Stub braucht dieses Repo zusätzlich das Secret CHEAPESTINFERENCE_API_KEY.
#
# Sweep über ALLE Repos (fängt auch nachts gepushte PRs ab, die außerhalb des
# CheapestInference-Zeitblocks liegen): läuft zentral in pungggi/ai-review,
# Workflow "AI PR Review Sweep (alle Repos)" — hier ist nichts weiter nötig.

# Trigger-Politik (2026-11-03, nach dem E8.4-Loop): KEIN synchronize —
# jeder Fix-Push feuerte sonst automatisch das nächste Review und der
# Loop trug sich selbst (17+ Runden, teils Runde-für-Runde-Wiederholungen).
# Re-Review ist bewusst manuell: Actions → „AI PR Review“ → Run workflow
# (bzw. gh workflow run ai-review.yml --ref <branch> -f pr_number=<N>).
# Überspringen einzelner Pushes braucht dadurch KEIN [skip review] mehr.

on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR-Nummer (optional; leer = PR des aktuellen Branches)"
        required: false
        type: string

# Manuelle Mehrfach-Auslösungen stapeln nicht: die neueste gewinnt.
concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: pungggi/ai-review/.github/workflows/review.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit
